name: xscrape smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xscrape-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install xscrape
        run: python -m pip install -e .
      - name: Check search interface without X credentials
        run: |
          python - <<'PY'
          import inspect
          from twscrape import API
          signature = inspect.signature(API.search)
          print("xscrape import: OK")
          print("Search signature:", signature)
          assert "q" in signature.parameters
          print("Search interface: OK")
          print("Live X search: NOT TESTED (requires account authentication)")
          PY
